name: watch

on:
  schedule:
    # Every 10 minutes. GitHub cron is best-effort — expect delivery within
    # roughly 5–15 minutes of a posting, which is the realistic "immediately".
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two polls overlap: both would race the state commit.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python watcher.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase origin main
            git push
          fi
