# Company watchlist. Each entry is polled directly against the ATS public API.
# The detector keyword-filters EVERY role on the board, so adding a board here
# is full keyword coverage of that company at poll latency.
#
# Coverage scales with this file. There is no global "all Greenhouse" API —
# board tokens must be enumerated. Grow this list; the marginal cost per
# board is one HTTP request per cycle.
#
# greenhouse: token from boards.greenhouse.io/<token> or job-boards.greenhouse.io/<token>
# lever:      slug from jobs.lever.co/<slug>
# ashby:      board name from jobs.ashbyhq.com/<name>

greenhouse:
  - stripe
  - databricks
  - duolingo
  - robinhood
  - coinbase
  - cloudflare
  - figma
  - pinterest
  - mongodb
  - datadog
  - epicgames
  - neuralink
  - hudsonrivertrading
  - janestreet

lever:
  - palantir
  - plaid
  - voleon

ashby:
  - ramp
  - dedalus-labs
  - vercel
  - linear
  - notion
  - openai

# Workday tenants: same JSON API on every company's own subdomain.
workday:
  - company: NVIDIA
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
  - company: Schweitzer Engineering Laboratories
    host: selinc.wd1.myworkdayjobs.com
    tenant: selinc
    site: SEL

# Backstop: community list repos. Wide coverage, minutes-to-hours latency.
# Entries resolve to the employer's own page before publish — the aggregator
# link is never what we store or show.
github_lists:
  - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json
  - https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json

# Custom-site adapters (see detectors/custom_sites.py)
custom:
  - google
  - microsoft

# Browser-render tier (needs: pip install -e '.[browser]' && playwright install chromium)
browser:
  - apple

# Curated non-internship lists (programs, scholarships, research)
opportunity_lists:
  - https://raw.githubusercontent.com/Jose-Gael-Cruz-Lopez/underclassmen-opportunities/main/.github/scripts/listings.json

# Curated README-table lists (zapply style)
markdown_lists:
  - https://raw.githubusercontent.com/zapplyjobs/underclassmen-internships/main/README.md
