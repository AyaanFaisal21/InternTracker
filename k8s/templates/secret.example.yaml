# TEMPLATE. PLACEHOLDER VALUES ONLY. NEVER PUT A REAL SECRET IN THIS FILE.
#
# This file lives in k8s/templates/ so that `kubectl apply -f k8s/` cannot
# reach it. `-f` on a directory is not recursive. Applying this by hand
# would overwrite the real Secret with these placeholders, and the pods
# would keep running on their old env until the next restart, which is the
# worst possible time to find out.
#
# The Secret exists to be created imperatively on the node, from the .env
# file that already holds these values. Do that instead:
#
#   cd /opt/ruemployed
#   sudo k3s kubectl -n shortlist create secret generic shortlist-secrets \
#     --from-literal=DATABASE_URL="$(sed -n 's/^SUPABASE_URL_POSTGRES=//p' .env)" \
#     --from-literal=ANTHROPIC_API_KEY="$(sed -n 's/^ANTHROPIC_API_KEY=//p' .env)" \
#     --dry-run=client -o yaml | sudo k3s kubectl apply -f -
#
# Note the rename. compose maps the .env key SUPABASE_URL_POSTGRES onto the
# container env var DATABASE_URL. The Secret key must be DATABASE_URL,
# which is what store.py reads.
#
# --dry-run=client piped into apply makes the command idempotent, so the
# same line creates the Secret the first time and rotates it after that.
#
# AWS credentials are deliberately absent. There are none. boto3 resolves
# the EC2 instance role over IMDSv2, so SES authenticates with no
# long-lived key on the box, in the image, in .env, or in this cluster.
# Adding an AWS_SECRET_ACCESS_KEY here would be a downgrade, not a fix.
# See src/intake/config.py, NotifySettings.
#
# Kubernetes Secrets are base64, not encryption. Anything in here is
# readable by anyone with cluster access, and k3s stores it in the sqlite
# datastore at /var/lib/rancher/k3s/server/db unencrypted unless secrets
# encryption is enabled at install. On a single-node box that is the same
# trust boundary as .env with mode 600, no better and no worse.
apiVersion: v1
kind: Secret
metadata:
  name: shortlist-secrets
  namespace: shortlist
  labels:
    app.kubernetes.io/part-of: shortlist
type: Opaque
stringData:
  # Supabase session pooler string. The free tier serves direct 5432 over
  # IPv6 only, so this must be the pooler host.
  DATABASE_URL: "postgresql://postgres.PROJECT_REF:REPLACE_ME@aws-0-us-east-2.pooler.supabase.com:5432/postgres"
  # Verifier and company resolver credential. Optional: both features stay
  # off without it, which is production's current state. The poller mounts
  # it with optional: true so the pod still starts when the key is absent.
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
