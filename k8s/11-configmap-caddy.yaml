# The Caddyfile, copied from the repo root with one edit: the reverse_proxy
# upstream is the Service name `shortlist-web` instead of the compose
# service name `web`. Everything else is byte-identical, so TLS, gzip, the
# /api split and the SPA fallback behave exactly as they do today.
#
# The root Caddyfile is not touched. Compose keeps reading it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shortlist-caddyfile
  namespace: shortlist
  labels:
    app.kubernetes.io/part-of: shortlist
data:
  Caddyfile: |
    # DOMAIN env: a hostname enables automatic HTTPS via Let's Encrypt;
    # ":80" serves plain http for bare-IP access.
    # One origin serves everything: /api/* proxies to the intake server,
    # all other paths serve the React build, unknown paths fall back to
    # index.html so client-side routes resolve on direct load.
    {$DOMAIN} {
      encode gzip
      handle /api/* {
        reverse_proxy shortlist-web:8642
      }
      handle {
        root * /srv/frontend
        try_files {path} /index.html
        file_server
      }
    }
