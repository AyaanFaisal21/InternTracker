[project]
name = "shortlist-intake"
version = "0.1.0"
description = "Multi-source SWE internship posting intake engine with verification gate"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright"]
postgres = ["psycopg[binary]>=3.2"]
email = ["boto3>=1.34"]   # SES delivery; absent means notifications log only

[project.scripts]
intake = "intake.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
