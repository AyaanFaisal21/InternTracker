# Shortlist: poller (detection loop) + web (dashboard) over one SQLite
# volume. WAL mode makes the two-process sharing safe on a single host.
#
#   docker compose up -d --build
#   docker compose logs -f poller
#
# Verification: set ANTHROPIC_API_KEY in .env and switch the poller command
# to drop --no-verify once the verification policy is decided.

services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8642}:8642"
    volumes:
      - data:/data
    environment:
      # set -> postgres store; empty -> sqlite on the shared volume
      - DATABASE_URL=${SUPABASE_URL_POSTGRES:-}
      # web sends the confirmation email at subscribe time, so it needs the
      # same notify config as the poller. AWS credentials come from the
      # instance role, never from here.
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - NOTIFY_FROM=${NOTIFY_FROM:-}
      - NOTIFY_POSTAL_ADDRESS=${NOTIFY_POSTAL_ADDRESS:-}
      - NOTIFY_BASE_URL=${NOTIFY_BASE_URL:-https://short-list.app}
      - SES_CONFIGURATION_SET=${SES_CONFIGURATION_SET:-}
      - NOTIFY_DAILY_CAP=${NOTIFY_DAILY_CAP:-3}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8642/api/postings', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  poller:
    build:
      context: .
      target: poller
    command: ["intake", "loop", "-i", "120", "--no-verify"]
    volumes:
      - data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=${SUPABASE_URL_POSTGRES:-}
      - INTAKE_RESOLVER_BUDGET=${INTAKE_RESOLVER_BUDGET:-10}
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - NOTIFY_FROM=${NOTIFY_FROM:-}
      - NOTIFY_POSTAL_ADDRESS=${NOTIFY_POSTAL_ADDRESS:-}
      - NOTIFY_BASE_URL=${NOTIFY_BASE_URL:-https://short-list.app}
      - SES_CONFIGURATION_SET=${SES_CONFIGURATION_SET:-}
      - NOTIFY_DAILY_CAP=${NOTIFY_DAILY_CAP:-3}
    restart: unless-stopped

  # Build-and-exit: refreshes the static bundle Caddy serves. Runs on
  # every `up`; cp is atomic enough for a static swap.
  frontend:
    build:
      context: .
      target: frontend
    command: ["sh", "-c", "rm -rf /srv/frontend/* && cp -r /fe/dist/. /srv/frontend/"]
    volumes:
      - frontend_dist:/srv/frontend
    restart: "no"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - frontend_dist:/srv/frontend:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      frontend:
        condition: service_completed_successfully

volumes:
  data:
  caddy_data:
  caddy_config:
  frontend_dist:
